<header
  class="sticky top-0 z-50 w-full border-b transform-gpu [backface-visibility:hidden]"
  [class.bg-white]="!isMenuVisible()"
  [class.border-slate-200]="!isMenuVisible()"
  [class.bg-transparent]="isMenuVisible()"
  [class.border-transparent]="isMenuVisible()"
>
  <nav
    aria-label="Navegação principal"
    class="mx-auto flex w-full max-w-[1728px] items-center justify-between px-4 py-4 md:px-8 lg:px-20"
  >

    <a
      (click)="scrollToSection('hero')"
      class="relative z-[60] cursor-pointer text-xs font-black tracking-tight md:hover:scale-105 md:text-lg"
    >
      <span class="bg-gradient-to-r from-blue-900 to-red-700 bg-clip-text text-transparent">
        Vinicius&lt;/&gt;
      </span>
    </a>

    <!-- Links Desktop -->
    <ul class="hidden items-center gap-4 text-xs font-semibold md:flex md:gap-8 md:text-sm">

      <li>
        <a
          (click)="scrollToSection('about')"
          class="inline-block cursor-pointer md:hover:scale-105"
          [class.text-slate-600]="activeSection() === 'about'"
          [class.text-slate-900]="activeSection() !== 'about'"
        >
          Sobre
        </a>
      </li>

      <li>
        <a
          (click)="scrollToSection('skills')"
          class="inline-block cursor-pointer md:hover:scale-105"
          [class.text-slate-600]="activeSection() === 'skills'"
          [class.text-slate-900]="activeSection() !== 'skills'"
        >
          Skills
        </a>
      </li>

      <li>
        <a
          (click)="scrollToSection('projects')"
          class="inline-block cursor-pointer md:hover:scale-105"
          [class.text-slate-600]="activeSection() === 'projects'"
          [class.text-slate-900]="activeSection() !== 'projects'"
        >
          Projetos
        </a>
      </li>

      <!-- Get In Touch -->
      <li>
        <a
          (click)="scrollToSection('contact')"
          class="group flex w-44 cursor-pointer items-center justify-between rounded-full bg-[#f5efe3] py-2 pl-6 pr-3 text-slate-900 transition-opacity duration-200"
          [class.opacity-80]="activeSection() === 'contact'"
        >
          <span>Get in touch</span>

          <span
            class="flex h-10 w-10 translate-x-1 shrink-0 items-center justify-center rounded-full bg-orange-500 transition-transform duration-200 ease-out group-hover:scale-125"
          >
            <svg
              class="h-7 w-7 transition-transform duration-200 ease-out group-hover:-rotate-25"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10.05 4.575a1.575 1.575 0 1 0-3.15 0v3m3.15-3v-1.5a1.575 1.575 0 0 1 3.15 0v1.5m-3.15 0 .075 5.925m3.075.75V4.575m0 0a1.575 1.575 0 0 1 3.15 0V15M6.9 7.575a1.575 1.575 0 1 0-3.15 0v8.175a6.75 6.75 0 0 0 6.75 6.75h2.018a5.25 5.25 0 0 0 3.712-1.538l1.732-1.732a5.25 5.25 0 0 0 1.538-3.712l.003-2.024a.668.668 0 0 1 .198-.471 1.575 1.575 0 1 0-2.228-2.228 3.818 3.818 0 0 0-1.12 2.687M6.9 7.575V12m6.27 4.318A4.49 4.49 0 0 1 16.35 15m.002 0h-.002"
              />
            </svg>
          </span>
        </a>
      </li>

    </ul>

    <!-- Menu Mobile Button -->
    <button
      type="button"
      (click)="toggleMenu()"
      class="relative z-[60] flex h-11 w-11 items-center justify-center rounded-full md:hidden"
      [class.bg-white]="isMenuOpen()"
      [class.bg-[#f5efe3]]="!isMenuOpen()"
      aria-label="Abrir menu"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span class="relative h-5 w-5">
        <span
          class="absolute left-0 top-1/2 block h-0.5 w-5 bg-slate-900 transition-all duration-300"
          [class.rotate-45]="isMenuOpen()"
          [class.-translate-y-2]="!isMenuOpen()"
          [class.translate-y-0]="isMenuOpen()"
        ></span>

        <span
          class="absolute left-0 top-1/2 block h-0.5 w-5 bg-slate-900 transition-all duration-300"
          [class.opacity-0]="isMenuOpen()"
          [class.opacity-100]="!isMenuOpen()"
        ></span>

        <span
          class="absolute left-0 top-1/2 block h-0.5 w-5 bg-slate-900 transition-all duration-300"
          [class.-rotate-45]="isMenuOpen()"
          [class.translate-y-2]="!isMenuOpen()"
          [class.translate-y-0]="isMenuOpen()"
        ></span>
      </span>
    </button>

  </nav>
</header>

@if (isMenuVisible()) {
  <div
    #menuOverlay
    class="mobile-menu-overlay fixed inset-0 z-40 bg-[#f5efe3] md:hidden"
  >
    <nav
      aria-label="Navegação mobile"
      class="flex h-full flex-col items-center justify-center px-6"
    >
      <div class="flex flex-col items-center">

        <a
          (click)="scrollToSection('about')"
          class="mobile-menu-item cursor-pointer py-4 text-3xl font-bold"
          [class.text-slate-600]="activeSection() === 'about'"
          [class.text-slate-900]="activeSection() !== 'about'"
        >
          Sobre
        </a>

        <a
          (click)="scrollToSection('skills')"
          class="mobile-menu-item cursor-pointer py-4 text-3xl font-bold"
          [class.text-slate-600]="activeSection() === 'skills'"
          [class.text-slate-900]="activeSection() !== 'skills'"
        >
          Skills
        </a>

        <a
          (click)="scrollToSection('projects')"
          class="mobile-menu-item cursor-pointer py-4 text-3xl font-bold"
          [class.text-slate-600]="activeSection() === 'projects'"
          [class.text-slate-900]="activeSection() !== 'projects'"
        >
          Projetos
        </a>

        <!-- Get In Touch Mobile -->
        <a
          (click)="scrollToSection('contact')"
          class="mobile-menu-item group mt-6 flex w-44 cursor-pointer items-center justify-between rounded-full bg-black py-2 pl-6 pr-3 text-white"
        >
          <span>Get in touch</span>

          <span
            class="flex h-10 w-10 translate-x-1 shrink-0 items-center justify-center rounded-full bg-orange-500 transition-transform duration-200 ease-out group-hover:scale-125"
          >
            <svg
              class="h-7 w-7 transition-transform duration-200 ease-out group-hover:-rotate-25"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10.05 4.575a1.575 1.575 0 1 0-3.15 0v3m3.15-3v-1.5a1.575 1.575 0 0 1 3.15 0v1.5m-3.15 0 .075 5.925m3.075.75V4.575m0 0a1.575 1.575 0 0 1 3.15 0V15M6.9 7.575a1.575 1.575 0 1 0-3.15 0v8.175a6.75 6.75 0 0 0 6.75 6.75h2.018a5.25 5.25 0 0 0 3.712-1.538l1.732-1.732a5.25 5.25 0 0 0 1.538-3.712l.003-2.024a1.575 1.575 0 1 0-2.228-2.228 3.818 3.818 0 0 0-1.12 2.687M6.9 7.575V12m6.27 4.318A4.49 4.49 0 0 1 16.35 15m.002 0h-.002"
              />
            </svg>
          </span>
        </a>

      </div>
    </nav>
  </div>
}
